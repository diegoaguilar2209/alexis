# On a version tag (v2.1.0), publishes a GitHub release with that version's CHANGELOG section.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('plugins/alexis/.claude-plugin/plugin.json'))['version'])")
          [ "$tag" = "$version" ] || { echo "Tag $tag != plugin.json version $version"; exit 1; }
      - name: Extract changelog section
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
