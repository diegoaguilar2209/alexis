# Weekly: bumps the pre-commit hook versions in the project template and opens a PR.
name: template-autoupdate

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pre-commit autoupdate
        run: |
          pip install pre-commit
          cd plugins/alexis/templates/project
          git init -q tmp-repo-for-autoupdate && cp .pre-commit-config.yaml tmp-repo-for-autoupdate/
          (cd tmp-repo-for-autoupdate && pre-commit autoupdate)
          cp tmp-repo-for-autoupdate/.pre-commit-config.yaml .pre-commit-config.yaml
          rm -rf tmp-repo-for-autoupdate
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/template-autoupdate
          title: "chore: update pre-commit hooks in the project template"
          commit-message: "chore: update pre-commit hooks in the project template"
          body: Automated weekly `pre-commit autoupdate` of `plugins/alexis/templates/project/.pre-commit-config.yaml`.
