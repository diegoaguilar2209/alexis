name: Skill or feature request
description: Propose a new skill, subagent, hook or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repeated work or failure would this fix? Evidence beats ideas.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Skill, subagent, hook, template or CLAUDE.md change, and how you would verify it works.
