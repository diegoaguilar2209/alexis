# Minimal CI: pre-commit, synced dependencies and tests on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  calidad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks detect scans the full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: gitleaks (full history)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" detect --redact --verbose

      - uses: astral-sh/setup-uv@v10.3.3

      # Not pre-commit/action: it bundles actions/cache@v4 (Node 20, deprecated).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (todos los hooks)
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Dependencies (uv)
        run: |
          uv venv env
          uv pip sync requirements.txt requirements-dev.txt -p env/bin/python

      - name: Tests
        # pytest exits with 5 when no tests were collected; that is fine until the first test exists.
        run: env/bin/pytest -q || [ $? -eq 5 ]

      - name: Validate docker-compose
        run: |
          if [ -f docker-compose.yml ]; then
            [ -f .env ] || cp .env.example .env 2>/dev/null || true
            docker compose config -q
          fi
