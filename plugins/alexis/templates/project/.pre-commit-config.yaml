repos:
  # pyupgrade: upgrades syntax to modern Python (f-strings, collection types, etc.).
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # isort: sorts and groups imports; profile aligned with Black.
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # black: Python code formatter.
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  # mypy: static type checking.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - types-requests
          - types-PyYAML

  # pre-commit-hooks: generic checks.
  #  - check-added-large-files: blocks heavy files (models, datasets)
  #  - check-yaml: YAML syntax (--unsafe allows Ansible/compose tags)
  #  - debug-statements: forgotten pdb/breakpoint
  #  - end-of-file-fixer / trailing-whitespace: whitespace cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-docstring-first
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  # pip-compile: keeps requirements.txt in sync with requirements.in.
  - repo: https://github.com/jazzband/pip-tools
    rev: 7.4.1
    hooks:
      - id: pip-compile
        files: ^requirements\.(in|txt)$

  # gitleaks: blocks credentials before they reach GitHub.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # hadolint: Dockerfile linter.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # prettier: formats Markdown, YAML and JSON.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
