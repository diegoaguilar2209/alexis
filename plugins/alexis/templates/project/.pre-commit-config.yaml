repos:
  # pyupgrade: upgrades syntax to modern Python (f-strings, collection types, etc.).
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py312-plus]

  # isort: sorts and groups imports; profile aligned with Black.
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # black: Python code formatter.
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  # mypy: static type checking.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - types-requests
          - types-PyYAML

  # pre-commit-hooks: generic checks.
  #  - check-added-large-files: blocks heavy files (models, datasets)
  #  - check-yaml: YAML syntax (--unsafe allows Ansible/compose tags)
  #  - debug-statements: forgotten pdb/breakpoint
  #  - end-of-file-fixer / trailing-whitespace: whitespace cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-docstring-first
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  # pip-compile (uv): keeps requirements.txt / requirements-dev.txt in sync with their .in files.
  # Portable: pre-commit installs uv itself, no binaries from the host machine are needed.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: pip-compile
        name: pip-compile requirements.in
        args:
          [requirements.in, -o, requirements.txt, --python-version, "3.12", -q]
      - id: pip-compile
        name: pip-compile requirements-dev.in
        args:
          [
            requirements-dev.in,
            -o,
            requirements-dev.txt,
            --python-version,
            "3.12",
            -q,
          ]
        files: ^requirements(-dev)?\.(in|txt)$

  # gitleaks: blocks credentials before they reach GitHub.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # pre-commit downloads its own Go toolchain, so the host Go version is irrelevant.
        # Must be >= the `go` line of gitleaks' go.mod; raise it when bumping rev.
        language_version: "1.25.0"

  # hadolint: Dockerfile linter.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # prettier: formats Markdown, YAML and JSON.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
