# Local observability for Claude Code: OpenTelemetry collector -> Prometheus (metrics) + Loki (events) -> Grafana.
# Start:  docker compose -f telemetry/docker-compose.yml up -d
# Then:   source telemetry/claude-otel.env && claude
# Grafana: http://localhost:3000 (anonymous viewer). Import a community dashboard, e.g. grafana.com ID 25052.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: on-failure

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    restart: on-failure

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    restart: on-failure
